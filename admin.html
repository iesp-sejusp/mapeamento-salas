<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Banco Único</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs (Compatibilidade Direta no Navegador) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body onload="iniciarPainel()">

    <div class="wrapper">
        <header>
            <div class="logo-container">
                <img src="sua-logo.png" alt="Logo" onerror="this.style.display='none'">
                <h1>Painel do Administrador (Sincronizado)</h1>
            </div>
            <nav>
                <a href="index.html" style="background: #6c757d;">Ver Mapa Público</a>
            </nav>
        </header>

        <div class="container" style="margin-top: 30px;">
            
            <!-- SECAO DE CADASTRO DE SALAS -->
            <div style="margin-bottom: 30px;">
                <h3>Cadastro de Salas</h3>
                <p>Cadastre novas salas informando o nome, bloco e a posição percentual (X e Y de 0 a 100) na planta baixa:</p>
                <div>
                    <div class="form-grid">
                        <div>
                            <label>Nome da Sala:</label>
                            <input type="text" id="nova-sala-nome" placeholder="Ex: Sala 103">
                        </div>
                        <div>
                            <label>Bloco:</label>
                            <input type="text" id="nova-sala-bloco" placeholder="Ex: Bloco A">
                        </div>
                    </div>
                    <div class="form-grid">
                        <div>
                            <label>Posição X (%):</label>
                            <input type="number" id="nova-sala-x" placeholder="Ex: 50" min="0" max="100" step="any">
                        </div>
                        <div>
                            <label>Posição Y (%):</label>
                            <input type="number" id="nova-sala-y" placeholder="Ex: 40" min="0" max="100" step="any">
                        </div>
                    </div>
                    <button type="button" class="btn-action" style="background: var(--primary-color);" onclick="cadastrarSalaNuvem()">Adicionar Sala</button>
                </div>
                <ul id="lista-salas-ul" class="list-group" style="margin-top: 15px;"></ul>
            </div>

            <hr style="border: 0; border-top: 1px solid #ddd; margin: 25px 0;">

            <!-- SECAO DE ATRIBUICAO DE OCUPACAO -->
            <div>
                <h3>Atribuir Ocupação à Sala</h3>
                <div>
                    <div class="form-grid">
                        <div>
                            <label>Selecione a Sala:</label>
                            <select id="select-sala"></select>
                        </div>
                        <div>
                            <label>Nome do Curso:</label>
                            <input type="text" id="input-curso-nome" placeholder="Ex: GLOCK">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div>
                            <label>Turno de Utilização:</label>
                            <select id="select-turno">
                                <option value="">-- Selecione o Turno --</option>
                                <option value="Manhã">Manhã</option>
                                <option value="Tarde">Tarde</option>
                                <option value="Noite">Noite</option>
                                <option value="Manhã e Tarde">Manhã e Tarde</option>
                                <option value="Tarde e Noite">Tarde e Noite</option>
                                <option value="Integral">Integral</option>
                            </select>
                        </div>
                        <div>
                            <label>Número de Alunos:</label>
                            <input type="number" id="input-alunos" placeholder="Ex: 44" min="1">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div>
                            <label>Data de Início:</label>
                            <input type="date" id="data-inicio">
                        </div>
                        <div>
                            <label>Data de Término:</label>
                            <input type="date" id="data-fim">
                        </div>
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label>Telefone para Contato:</label>
                        <input type="text" id="telefone-contato" placeholder="(96) 99109-0909">
                    </div>

                    <button type="button" class="btn-action" onclick="salvarOcupacaoNuvem()">Salvar Ocupação na Nuvem</button>
                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPT DE CONEXÃO FIREBASE (Sua Configuração Exata) -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB35Lel5RYdB6vXU-y4CSbrIJ49vejhJs0",
            authDomain: "salas-iesp.firebaseapp.com",
            databaseURL: "https://salas-iesp-default-rtdb.firebaseio.com",
            projectId: "salas-iesp",
            storageBucket: "salas-iesp.firebasestorage.app",
            messagingSenderId: "456076383863",
            appId: "1:456076383863:web:8edb172ae98c3be71f1872",
            measurementId: "G-4KG8K3ZQK0"
        };

        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function iniciarPainel() {
            // Sincroniza dados em tempo real da nuvem
            db.ref('/').on('value', (snapshot) => {
                const dados = snapshot.val() || {};
                const salas = dados.salas || {};
                atualizarInterfaceAdmin(salas);
            });
        }

        function atualizarInterfaceAdmin(salasObj) {
            const selectSala = document.getElementById("select-sala");
            const listaSalasUl = document.getElementById("lista-salas-ul");
            
            if (selectSala) selectSala.innerHTML = `<option value="">-- Selecione a Sala --</option>`;
            if (listaSalasUl) listaSalasUl.innerHTML = "";

            Object.keys(salasObj).forEach(id => {
                const s = salasObj[id];
                if (selectSala) {
                    selectSala.innerHTML += `<option value="${id}">${s.nome} (${s.bloco})</option>`;
                }
                if (listaSalasUl) {
                    listaSalasUl.innerHTML += `<li><strong>${s.nome}</strong> (${s.bloco}) - X:${s.x}%, Y:${s.y}% <button type="button" onclick="removerSalaNuvem('${id}')" style="background:var(--danger-color); color:white; border:none; padding:3px 8px; border-radius:3px; cursor:pointer; float:right;">Excluir</button></li>`;
                }
            });
        }

        function cadastrarSalaNuvem() {
            const nome = document.getElementById("nova-sala-nome").value.trim();
            const bloco = document.getElementById("nova-sala-bloco").value.trim();
            const x = parseFloat(document.getElementById("nova-sala-x").value);
            const y = parseFloat(document.getElementById("nova-sala-y").value);

            if (!nome || !bloco || isNaN(x) || isNaN(y)) {
                alert("Preencha todos os campos da sala corretamente.");
                return;
            }

            const novaSalaRef = db.ref('salas').push();
            novaSalaRef.set({ nome, bloco, x, y }, (error) => {
                if (error) {
                    alert("Erro ao salvar sala na nuvem.");
                } else {
                    alert("Sala cadastrada e sincronizada globalmente!");
                    document.getElementById("nova-sala-nome").value = "";
                    document.getElementById("nova-sala-bloco").value = "";
                    document.getElementById("nova-sala-x").value = "";
                    document.getElementById("nova-sala-y").value = "";
                }
            });
        }

        function removerSalaNuvem(id) {
            if (!confirm("Deseja realmente excluir esta sala?")) return;
            db.ref('salas/' + id).remove();
            db.ref('ocupacoes/' + id).remove();
            alert("Sala removida com sucesso!");
        }

        function salvarOcupacaoNuvem() {
            const salaId = document.getElementById("select-sala").value;
            const curso = document.getElementById("input-curso-nome").value.trim();
            const turno = document.getElementById("select-turno").value;
            const alunos = document.getElementById("input-alunos").value.trim();
            const inicio = document.getElementById("data-inicio").value;
            const fim = document.getElementById("data-fim").value;
            const telefone = document.getElementById("telefone-contato").value.trim();

            if (!salaId || !curso || !turno || !alunos || !inicio || !fim || !telefone) {
                alert("Preencha todos os campos da ocupação.");
                return;
            }

            db.ref('ocupacoes/' + salaId).set({
                curso, turno, alunos, inicio, fim, telefone
            }, (error) => {
                if (error) {
                    alert("Erro ao salvar ocupação.");
                } else {
                    alert("Ocupação salva na nuvem! Visível instantaneamente em qualquer navegador.");
                    document.getElementById("input-curso-nome").value = "";
                    document.getElementById("select-turno").value = "";
                    document.getElementById("input-alunos").value = "";
                    document.getElementById("data-inicio").value = "";
                    document.getElementById("data-fim").value = "";
                    document.getElementById("telefone-contato").value = "";
                }
            });
        }
    </script>
</body>
</html>
