<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - IESP / CBMAP</title>
    
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('seu-fundo.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #002244;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .wrapper {
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #003366;
            padding-bottom: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-container img {
            height: 60px;
            max-width: 150px;
            object-fit: contain;
            background: #fff;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        h1 { color: #003366; font-size: 22px; margin: 0; }
        .btn-voltar {
            background: #6c757d;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-voltar:hover { background: #5a6268; }
        
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('seu-fundo.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-box {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 340px;
            text-align: center;
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
        }
        .login-logo {
            height: 70px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ced4da;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .login-box button {
            background: #003366;
            color: white;
            border: none;
            padding: 10px 20px;
            width: 100%;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-box button:hover { background: #002244; }

        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 25px;
            border: 1px solid #e9ecef;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 13px; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-acao {
            background: #003366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-acao:hover { background: #002244; }
        .btn-liberar {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .btn-imprimir {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-imprimir:hover { background: #218838; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            margin-bottom: 25px;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }
        th { background: #003366; color: white; }
        .relatorio-card {
            background: #e9ecef;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #003366;
        }

        @media print {
            body { background: #fff; padding: 0; }
            .no-print { display: none !important; }
            .wrapper { box-shadow: none; padding: 0; max-width: 100%; background: #fff; }
            #area-impressao { display: block !important; }
            table { border: 1px solid #000; }
            th, td { border: 1px solid #000; padding: 8px; }
            th { background: #003366 !important; color: white !important; -webkit-print-color-adjust: exact; }
        }
    </style>

    <!-- Firebase SDKs Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- TELA DE LOGIN ADMINISTRATIVO -->
    <div id="login-overlay" class="no-print">
        <div class="login-box">
            <img src="sua-logo.png" alt="Logo IESP" class="login-logo" onerror="this.style.display='none'">
            <h3 style="color: #003366; margin-top:0;">Área Restrita - IESP</h3>
            <p style="font-size: 13px; color: #666;">Digite a senha administrativa:</p>
            <input type="password" id="senha-admin" placeholder="Senha de acesso" onkeypress="if(event.key === 'Enter') validarSenha()">
            <button onclick="validarSenha()">Entrar no Painel</button>
            <p id="erro-senha" style="color: #dc3545; font-size: 12px; margin-top: 10px; display: none;">Senha incorreta!</p>
        </div>
    </div>

    <div class="wrapper" id="painel-conteudo" style="display: none;">
        <header class="no-print">
            <div class="logo-container">
                <img src="sua-logo.png" alt="Logo IESP" onerror="this.style.display='none'">
                <h1>Painel Administrativo - IESP / CBMAP</h1>
            </div>
            <a href="index.html" class="btn-voltar">Ver Mapa Público</a>
        </header>

        <!-- 1. CADASTRAR SALAS -->
        <div class="form-section no-print">
            <h3 style="margin-top:0; color:#003366;">1. Cadastrar Nova Sala (Ilimitado)</h3>
            <form id="form-sala" onsubmit="cadastrarSala(event)">
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 2;">
                        <label>Nome da Sala:</label>
                        <input type="text" id="sala-nome" required placeholder="Ex: B7">
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label>Bloco:</label>
                        <input type="text" id="sala-bloco" required placeholder="Ex: B">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Pos X (%):</label>
                        <input type="number" id="sala-x" value="50" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Pos Y (%):</label>
                        <input type="number" id="sala-y" value="50" required>
                    </div>
                </div>
                <button type="submit" class="btn-acao">➕ Salvar Sala</button>
            </form>
        </div>

        <!-- 2. CADASTRAR CURSOS E INSTITUIÇÕES -->
        <div style="display: flex; gap: 20px;" class="no-print">
            <div class="form-section" style="flex: 1;">
                <h3 style="margin-top:0; color:#003366;">Cadastrar Novo Curso</h3>
                <form id="form-curso" onsubmit="cadastrarCurso(event)">
                    <div class="form-group
