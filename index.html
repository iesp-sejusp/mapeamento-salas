<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Salas de Aula - Tempo Real</title>
    
    <style>
        body {
            position: relative;
            min-height: 100vh;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .wrapper {
            max-width: 1100px;
            margin: 0 auto;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            margin-top: 20px;
            margin-bottom: 40px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #003366;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 { color: #003366; font-size: 22px; margin: 0; }
        nav a {
            background: #003366;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        nav a:hover { background: #002244; }
        
        #status-conexao {
            font-weight: bold;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            text-align: center;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        
        /* Contêiner da Planta Baixa */
        #mapa-container {
            position: relative;
            display: inline-block;
            width: 100%;
            text-align: center;
            background: #e9ecef;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ced4da;
        }
        #mapa-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Marcadores interativos sobre a imagem */
        .sala-marcador {
            position: absolute;
            transform: translate(-50%, -50%);
            padding: 6px 12px;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            z-index: 20;
            white-space: nowrap;
        }
        .sala-marcador.livre { background: #28a745; border: 2px solid #fff; }
        .sala-marcador.ocupada { background: #dc3545; border: 2px solid #fff; }
        
        /* Tooltip de detalhes ao passar o mouse */
        .tooltip-info {
            display: none;
            position: absolute;
            bottom: 135%;
            left: 50%;
            transform: translateX(-50%);
            background: #212529;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            width: 230px;
            font-size: 11px;
            line-height: 1.5;
            z-index: 30;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            text-align: left;
            pointer-events: none;
        }
        .sala-marcador:hover .tooltip-info { display: block; }

        /* Legenda */
        .legenda-planta {
            display: flex;
            gap: 25px;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
            align-items: center;
            justify-content: center;
        }
        .legenda-item { display: flex; align-items: center; gap: 8px; }
        .bola-status { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
        .bola-status.livre { background: #28a745; }
        .bola-status.ocupada { background: #dc3545; }

        /* Cards Mobile */
        .sala-card-mobile {
            background: #f8f9fa;
            border: 1px solid #d1d9e0;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 6px;
        }
        .btn-atualizar {
            background: #003366;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>

    <!-- Firebase SDKs Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body onload="carregarSistema()">

    <div class="wrapper">
        <header>
            <h1>Mapeamento de Salas de Aula (Sincronizado)</h1>
            <nav>
                <a href="admin.html">Área Administrativa</a>
            </nav>
        </header>

        <div class="container">
            <h2>Planta Baixa e Localização das Salas</h2>
            <p>Consulte abaixo o status em tempo real, turnos e ocupações das salas sincronizadas na nuvem.</p>

            <div id="status-conexao">🔄 Conectando ao banco de dados...</div>
            <div style="text-align: right;">
                <button class="btn-atualizar" onclick="carregarSistema()">🔄 Atualizar Dados</button>
            </div>

            <!-- Mapa com a Planta Baixa -->
            <div id="mapa-desktop-view">
                <div id="mapa-container"></div>
                <div class="legenda-planta">
                    <div class="legenda-item"><span class="bola-status livre"></span> Disponível (Livre)</div>
                    <div class="legenda-item"><span class="bola-status ocupada"></span> Ocupada</div>
                </div>
            </div>

            <!-- Cards / Lista -->
            <div id="lista-mobile-view" style="margin-top: 35px;">
                <h3 style="margin-top: 0; font-size: 18px; color: #003366;">Status Detalhado das Salas</h3>
                <div id="lista-mobile-container"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB35Lel5RYdB6vXU-y4CSbrIJ49vejhJs0",
            authDomain: "salas-iesp.firebaseapp.com",
            databaseURL: "https://salas-iesp-default-rtdb.firebaseio.com",
            projectId: "salas-iesp",
            storageBucket: "salas-iesp.firebasestorage.app",
            messagingSenderId: "456076383863",
            appId: "1:456076383863:web:8edb172ae98c3be71f1872",
            measurementId: "G-4KG8K3ZQK0"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function carregarSistema() {
            const statusDiv = document.getElementById("status-conexao");
            statusDiv.style.background = "#fff3cd";
            statusDiv.style.color = "#856404";
            statusDiv.innerHTML = "🔄 Buscando dados da nuvem...";

            db.ref('/').once('value').then((snapshot) => {
                const dados = snapshot.val() || {};
                const salas = dados.salas || {};
                const ocupacoes = dados.ocupacoes || {};

                statusDiv.style.background = "#d4edda";
                statusDiv.style.color = "#155724";
                statusDiv.innerHTML = "✅ Dados sincronizados com sucesso!";
                
                renderizarTudo(salas, ocupacoes);
            }).catch((error) => {
                statusDiv.style.background = "#f8d7da";
                statusDiv.style.color = "#721c24";
                statusDiv.innerHTML = "❌ Erro: " + error.message;
            });
        }

        function renderizarTudo(salasObj, ocupacoesObj) {
            const containerDesktop = document.getElementById("mapa-container");
            const containerMobile = document.getElementById("lista-mobile-container");
            
            const idsSalas = Object.keys(salasObj);

            // 1. Render Desktop com Planta Baixa
            if (containerDesktop) {
                containerDesktop.innerHTML = "";

                if (idsSalas.length === 0) {
                    containerDesktop.innerHTML = `<p style="padding: 40px; color:#666;">Nenhuma sala cadastrada.</p>`;
                } else {
                    const img = document.createElement("img");
                    img.src = "planta-baixa.jpg";
                    img.alt = "Planta Baixa";
                    img.onerror = function() {
                        containerDesktop.innerHTML = `<div style="padding:20px; color:#d9534f;">⚠️ Imagem <em>planta-baixa.jpg</em> não encontrada na pasta.</div>`;
                    };
                    containerDesktop.appendChild(img);

                    idsSalas.forEach(id => {
                        const sala = salasObj[id];
                        let ocupacaoEncontrada = null;

                        Object.keys(ocupacoesObj).forEach(ocKey => {
                            const oc = ocupacoesObj[ocKey];
                            if (ocKey === id || oc.salaId === id || oc.sala === sala.nome) {
                                ocupacaoEncontrada = oc;
                            }
                        });

                        const isOcupada = ocupacaoEncontrada && ocupacaoEncontrada.curso;

                        const marcador = document.createElement("div");
                        marcador.className = `sala-marcador ${isOcupada ? 'ocupada' : 'livre'}`;
                        marcador.style.left = `${sala.x !== undefined ? sala.x : 50}%`;
                        marcador.style.top = `${sala.y !== undefined ? sala.y : 50}%`;

                        marcador.innerHTML = `
                            📍 ${sala.nome} (${isOcupada ? 'Ocupada' : 'Livre'})
                            <div class="tooltip-info">
                                <strong style="color: #ffc107;">Sala ${sala.nome} (Bloco ${sala.bloco})</strong><br>
                                <strong>Status:</strong> ${isOcupada ? '<span style="color:#ff6b6b">Ocupada</span>' : '<span style="color:#51cf66">Disponível</span>'}<br>
                                ${isOcupada ? `
                                    <strong>Curso:</strong> ${ocupacaoEncontrada.curso}<br>
                                    <strong>Instituição:</strong> ${ocupacaoEncontrada.instituicao || 'N/A'}<br>
                                    <strong>Turno:</strong> ${ocupacaoEncontrada.turno || 'N/A'}<br>
                                    <strong>Alunos:</strong> ${ocupacaoEncontrada.alunos || 'N/A'}<br>
                                    <strong>Início:</strong> ${ocupacaoEncontrada.inicio || 'N/A'}<br>
                                    <strong>Fim:</strong> ${ocupacaoEncontrada.fim || 'N/A'}
                                ` : 'Sala livre para agendamento.'}
                            </div>
                        `;
                        containerDesktop.appendChild(marcador);
                    });
                }
            }

            // 2. Render Mobile / Cards
            if (containerMobile) {
                containerMobile.innerHTML = "";
                if (idsSalas.length === 0) {
                    containerMobile.innerHTML = `<p style="color:#666;">Nenhuma sala cadastrada.</p>`;
                } else {
                    idsSalas.forEach(id => {
                        const sala = salasObj[id];
                        let ocupacaoEncontrada = null;

                        Object.keys(ocupacoesObj).forEach(ocKey => {
                            const oc = ocupacoesObj[ocKey];
                            if (ocKey === id || oc.salaId === id || oc.sala === sala.nome) {
                                ocupacaoEncontrada = oc;
                            }
                        });

                        const isOcupada = ocupacaoEncontrada && ocupacaoEncontrada.curso;

                        const card = document.createElement("div");
                        card.className = "sala-card-mobile";
                        card.style.borderLeft = `6px solid ${isOcupada ? '#dc3545' : '#28a745'}`;
                        
                        card.innerHTML = `
                            <h4 style="margin: 0 0 6px 0; color: #003366;">🏫 Sala ${sala.nome} (Bloco ${sala.bloco})</h4>
                            <p style="margin: 4px 0;"><strong>Status:</strong> ${isOcupada ? '<span style="color:#dc3545; font-weight:bold;">🔴 Ocupada</span>' : '<span style="color:#28a745; font-weight:bold;">🟢 Disponível (Livre)</span>'}</p>
                            ${isOcupada ? `
                                <p style="margin: 4px 0;"><strong>Curso:</strong> ${ocupacaoEncontrada.curso}</p>
                                <p style="margin: 4px 0;"><strong>Instituição:</strong> ${ocupacaoEncontrada.instituicao || 'Não informada'}</p>
                                <p style="margin: 4px 0;"><strong>Turno:</strong> ${ocupacaoEncontrada.turno \vert{}\vert{} 'N/A'} \vert{} <strong>Alunos:</strong>${ocupacaoEncontrada.alunos || 'N/A'}</p>
                                <p style="margin: 4px 0; color: #0056b3;"><strong>Período:</strong> ${ocupacaoEncontrada.inicio \vert{}\vert{} ''} até ${ocupacaoEncontrada.fim || ''}</p>
                            ` : `<p style="margin: 4px 0; color: #666; font-style: italic;">Sala livre para uso.</p>`}
                        `;
                        containerMobile.appendChild(card);
                    });
                }
            }
        }
    </script>
</body>
</html>
