<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Salas de Aula - IESP / CBMAP</title>
    
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('seu-fundo.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #002244;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .wrapper {
            max-width: 1100px;
            margin: 0 auto;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #003366;
            padding-bottom: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-container img {
            height: 60px;
            max-width: 150px;
            object-fit: contain;
            background: #fff;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        h1 { color: #003366; font-size: 22px; margin: 0; }
        nav a {
            background: #003366;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        nav a:hover { background: #002244; }

        #status-conexao {
            font-weight: bold;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            text-align: center;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        #mapa-container {
            position: relative;
            display: inline-block;
            width: 100%;
            text-align: center;
            background: #e9ecef;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ced4da;
        }
        #mapa-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }
        .sala-marcador {
            position: absolute;
            transform: translate(-50%, -50%);
            padding: 6px 12px;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            z-index: 20;
            white-space: nowrap;
        }
        .sala-marcador.livre { background: #28a745; border: 2px solid #fff; }
        .sala-marcador.ocupada { background: #dc3545; border: 2px solid #fff; }
        
        /* Correção definitiva para o tooltip quebrar texto longo em várias linhas */
        .tooltip-info {
            display: none;
            position: absolute;
            bottom: 135%;
            left: 50%;
            transform: translateX(-50%);
            background: #212529;
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            width: 260px; /* Largura controlada */
            font-size: 11px;
            line-height: 1.4;
            z-index: 30;
            text-align: left;
            pointer-events: none;
            white-space: normal !important; /* Força quebra de linha */
            word-break: break-word !important; /* Quebra palavras longas */
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .sala-marcador:hover .tooltip-info { display: block; }
        
        .sala-card-mobile {
            background: #f8f9fa;
            border: 1px solid #d1d9e0;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 6px;
        }
        .btn-atualizar {
            background: #003366;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>

    <!-- Firebase SDKs Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="wrapper">
        <div class="container">
            <header>
                <div class="logo-container">
                    <img src="sua-logo.png" alt="Logo IESP" onerror="this.style.display='none'">
                    <h1>Mapeamento de Salas - IESP / CBMAP</h1>
                </div>
                <nav><a href="admin.html">Área Administrativa</a></nav>
            </header>

            <h2>Planta Baixa e Status das Salas</h2>
            <div id="status-conexao">🔄 Conectando ao banco de dados...</div>
            <div style="text-align: right;">
                <button class="btn-atualizar" onclick="carregarSistema()">🔄 Atualizar Dados</button>
            </div>

            <div id="mapa-container"></div>

            <div style="margin-top: 35px;">
                <h3 style="color: #003366;">Status Detalhado das Salas</h3>
                <div id="lista-mobile-container"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB35Lel5RYdB6vXU-y4CSbrIJ49vejhJs0",
            authDomain: "salas-iesp.firebaseapp.com",
            databaseURL: "https://salas-iesp-default-rtdb.firebaseio.com",
            projectId: "salas-iesp",
            storageBucket: "salas-iesp.firebasestorage.app",
            messagingSenderId: "456076383863",
            appId: "1:456076383863:web:8edb172ae98c3be71f1872",
            measurementId: "G-4KG8K3ZQK0"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        window.carregarSistema = function() {
            var statusDiv = document.getElementById("status-conexao");
            statusDiv.style.background = "#fff3cd";
            statusDiv.style.color = "#856404";
            statusDiv.innerHTML = "🔄 Buscando dados da nuvem...";

            db.ref('/').once('value').then(function(snapshot) {
                var dados = snapshot.val() || {};
                var salas = dados.salas || {};
                var ocupacoes = dados.ocupacoes || {};

                statusDiv.style.background = "#d4edda";
                statusDiv.style.color = "#155724";
                statusDiv.innerHTML = "✅ Dados sincronizados com sucesso!";
                
                renderizar(salas, ocupacoes);
            }).catch(function(error) {
                statusDiv.style.background = "#f8d7da";
                statusDiv.style.color = "#721c24";
                statusDiv.innerHTML = "❌ Erro: " + error.message;
            });
        };

        function renderizar(salasObj, ocupacoesObj) {
            var containerMapa = document.getElementById("mapa-container");
            var containerLista = document.getElementById("lista-mobile-container");
            var ids = Object.keys(salasObj);

            containerMapa.innerHTML = "";
            containerLista.innerHTML = "";

            if (ids.length === 0) {
                containerMapa.innerHTML = "<p style='padding: 30px;'>Nenhuma sala cadastrada.</p>";
                containerLista.innerHTML = "<p>Nenhuma sala cadastrada.</p>";
                return;
            }

            var img = document.createElement("img");
            img.src = "planta-baixa.jpg";
            img.alt = "Planta Baixa";
            img.onerror = function() {
                containerMapa.innerHTML = "<div style='padding:20px; color:#d9534f;'>⚠️ Imagem <em>planta-baixa.jpg</em> não encontrada na pasta.</div>";
            };
            containerMapa.appendChild(img);

            ids.forEach(function(id) {
                var sala = salasObj[id];
                var ocupacao = null;

                Object.keys(ocupacoesObj).forEach(function(ocKey) {
                    var oc = ocupacoesObj[ocKey];
                    if (ocKey === id || oc.salaId === id || oc.sala === sala.nome) {
                        ocupacao = oc;
                    }
                });

                var ocupada = ocupacao && ocupacao.curso;

                var marcador = document.createElement("div");
                marcador.className = "sala-marcador " + (ocupada ? "ocupada" : "livre");
                marcador.style.left = (sala.x !== undefined ? sala.x : 50) + "%";
                marcador.style.top = (sala.y !== undefined ? sala.y : 50) + "%";

                var tooltipHtml = "<b>Sala " + sala.nome + " (" + sala.bloco + ")</b><br>" +
                                  "Status: " + (ocupada ? "Ocupada" : "Disponível");
                if (ocupada) {
                    // Usando divs internas para garantir o empacotamento correto do texto longo
                    tooltipHtml += "<div style='margin-top:4px;'><strong>Curso:</strong> " + ocupacao.curso + "</div>" +
                                   "<div><strong>Alunos:</strong> " + (ocupacao.alunos || "N/A") + "</div>";
                }

                marcador.innerHTML = "📍 " + sala.nome + "<div class='tooltip-info'>" + tooltipHtml + "</div>";
                containerMapa.appendChild(marcador);

                var card = document.createElement("div");
                card.className = "sala-card-mobile";
                card.style.borderLeft = "6px solid " + (ocupada ? "#dc3545" : "#28a745");
                
                var cardHtml = "<h4 style='margin:0 0 5px 0; color:#003366;'>🏫 Sala " + sala.nome + " (Bloco " + sala.bloco + ")</h4>" +
                               "<p style='margin:3px 0;'><strong>Status:</strong> " + (ocupada ? "<span style='color:#dc3545;'>Ocupada</span>" : "<span style='color:#28a745;'>Disponível</span>") + "</p>";
                
                if (ocupada) {
                    cardHtml += "<p style='margin:3px 0;'><strong>Curso:</strong> " + ocupacao.curso + "</p>" +
                                "<p style='margin:3px 0;'><strong>Instituição:</strong> " + (ocupacao.instituicao || "N/A") + " | <strong>Alunos:</strong> " + (ocupacao.alunos || "N/A") + "</p>" +
                                "<p style='margin:3px 0;'><strong>Período:</strong> " + (ocupacao.inicio || "") + " a " + (ocupacao.fim || "") + "</p>";
                }
                card.innerHTML = cardHtml;
                containerLista.appendChild(card);
            });
        }

        window.onload = function() {
            carregarSistema();
        };
    </script>
</body>
</html>
