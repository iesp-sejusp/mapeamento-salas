<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Salas de Aula - Planta Baixa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        <header>
            <div class="logo-container">
                <img src="sua-logo.png" alt="Logo Instituição" onerror="this.style.display='none'">
                <h1>Mapeamento de Salas de Aula</h1>
            </div>
            <nav>
                <a href="admin.html">Área Administrativa</a>
            </nav>
        </header>

        <div class="container">
            <h2>Planta Baixa e Localização das Salas</h2>
            <p>Consulte abaixo o status, turno, número de alunos e detalhes de ocupação das salas.</p>

            <!-- Visualização para Computadores (Mapa com marcadores) -->
            <div id="mapa-desktop-view">
                <div id="mapa-container"></div>
                <div class="legenda-planta">
                    <div class="legenda-item"><span class="bola-status livre"></span> Disponível</div>
                    <div class="legenda-item"><span class="bola-status ocupada"></span> Ocupada</div>
                </div>
            </div>

            <!-- Visualização para Celulares (Legenda em lista/cards detalhados) -->
            <div id="lista-mobile-view">
